{% extends "base.html" %}
{% block content %}
<div class="section-card">
    <h1 class="h4 mb-3">{{ assignment.title }} 提交列表</h1>
    {% for submission in submissions %}
        <div class="list-item-row">
            <div>
                <div class="fw-semibold">{{ submission.student.full_name }}</div>
                <div class="small text-muted">提交时间：{{ submission.submitted_at|date:"Y-m-d H:i" }}</div>
            </div>
            <div class="d-flex gap-2 align-items-center">
                <span class="badge text-bg-secondary">{{ submission.score|default:"待批改" }}</span>
                <a class="btn btn-sm btn-primary" href="{% url 'assignments:review' submission.pk %}">批改</a>
            </div>
        </div>
    {% empty %}
        <p class="text-muted mb-0">暂无学生提交。</p>
    {% endfor %}
</div>
{% endblock %}
